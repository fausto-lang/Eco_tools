[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pibble"
version = "0.1.0"
description = "Librería de asistencia inteligente con IA y procesamiento de texto"
dependencies = [
    "google-genai",
    "python-dotenv",
    "pillow",
    "requests",
    "python-magic"
]